<svg
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  [attr.width]="width()"
  [attr.height]="height()"
  aria-hidden="true"
>
  <defs>
    <radialGradient id="cr-scene-sky" cx="53%" cy="54%" r="75%">
      <stop offset="0" stop-color="#f5f4ee" />
      <stop offset="1" stop-color="#d8e5ec" />
    </radialGradient>
    <pattern id="cr-scene-dots" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#658899" opacity=".18" />
    </pattern>
    <pattern id="cr-oak" width="66" height="28" patternUnits="userSpaceOnUse">
      <rect width="66" height="28" fill="#f4d9ac" />
      <path d="M0 0h66v13H0Z" fill="#f8e4c3" />
      <path
        d="M29 0v13m26 1v14M0 0h66M0 14h66"
        fill="none"
        stroke="#c49c74"
        stroke-width=".75"
        opacity=".54"
      />
      <path d="M6 5h13m21 4h16M8 22h33" stroke="#ba8e65" stroke-width=".65" opacity=".22" />
    </pattern>
    <pattern id="cr-concrete" width="42" height="38" patternUnits="userSpaceOnUse">
      <rect width="42" height="38" fill="#c2cbd0" />
      <path d="M0 38V0h42" fill="none" stroke="#a6b3bb" stroke-width=".8" />
      <path d="M7 12h10m12 15h7" stroke="#e6edef" stroke-width="1" opacity=".7" />
    </pattern>
    <pattern id="cr-agent-tile" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#cbdfe3" />
      <path d="M0 24V0h24" fill="none" stroke="#9ebdc7" stroke-width=".8" />
      <path d="M5 6h12v12H5Z" fill="#d7e8e8" opacity=".55" />
    </pattern>
    <pattern
      id="cr-hazard"
      width="18"
      height="18"
      patternTransform="rotate(34)"
      patternUnits="userSpaceOnUse"
    >
      <rect width="18" height="18" fill="#e1b253" />
      <rect width="7" height="18" fill="#536674" />
    </pattern>
    <pattern id="cr-shutters" width="8" height="5" patternUnits="userSpaceOnUse">
      <rect width="8" height="5" fill="#7896a6" />
      <path d="M0 1h8" stroke="#b1c8d2" />
    </pattern>
    <linearGradient id="cr-window-sheen" x2="0" y2="1">
      <stop offset="0" stop-color="#e2f7f5" />
      <stop offset=".53" stop-color="#aad5e1" />
      <stop offset=".55" stop-color="#85b5c9" />
      <stop offset="1" stop-color="#7ea7bb" />
    </linearGradient>
    <radialGradient id="cr-lounge-light">
      <stop offset="0" stop-color="#fff4cb" stop-opacity=".65" />
      <stop offset="1" stop-color="#fff4cb" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect [attr.width]="width()" [attr.height]="height()" fill="url(#cr-scene-sky)" />
  <rect [attr.width]="width()" [attr.height]="height()" fill="url(#cr-scene-dots)" />
  <g class="base-shadows">
    @for (base of bases(); track $index) {
      <polygon [attr.points]="base.faces[2].points" />
    }
  </g>
  <g class="solid construction">
    @for (base of bases(); track $index) {
      @for (face of base.faces; track $index) {
        <polygon [attr.points]="face.points" [attr.fill]="face.fill" />
      }
    }
  </g>
  <g class="ground-layer" [attr.transform]="ground">
    @for (floor of floors(); track floor.x + ':' + floor.y) {
      <rect
        [attr.x]="floor.x"
        [attr.y]="floor.y"
        [attr.width]="floor.w"
        [attr.height]="floor.h"
        [attr.fill]="floor.fill"
      />
    }
    <rect x="49" y="161" width="403" height="65" rx="6" fill="#c8d4ba" opacity=".7" />
    <rect x="49" y="382" width="403" height="61" rx="6" fill="#c6d9ca" opacity=".7" />
    @for (lounge of loungeFurniture; track lounge.x + ':' + lounge.y) {
      <rect
        [attr.x]="lounge.x - 7"
        [attr.y]="lounge.y - 7"
        width="128"
        height="41"
        rx="7"
        fill="#d8b59a"
        stroke="#b48972"
      />
      <path
        [attr.d]="'M' + (lounge.x - 2) + ' ' + (lounge.y + 1) + 'h118'"
        stroke="#eed3b4"
        stroke-dasharray="5 3"
      />
    }
    <rect x="429" y="204" width="69" height="57" rx="6" fill="#d1ac91" />
    <path d="M434 211h60m-60 42h60" stroke="#f1d4af" stroke-width="1.5" />
    <rect x="41" y="364" width="451" height="15" rx="6" fill="#fff2d0" opacity=".68" />
    @for (row of capacity().garage; track row.offset) {
      <g [attr.transform]="'translate(0 ' + row.offset + ')'">
        <rect
          x="532"
          y="199"
          width="428"
          height="171"
          rx="9"
          fill="#a9b8c1"
          stroke="#edf1ef"
          stroke-width="2"
        />
        <path d="M535 206h420M535 375h420" stroke="#eee6c3" stroke-width="3" />
        @for (bay of row.bays; track bay.number) {
          <path
            [attr.d]="'M' + bay.left + ' 220v137h57V220'"
            fill="#a5b7c2"
            stroke="#ffcf64"
            stroke-width="2.8"
          />
          <path [attr.d]="'M' + (bay.left + 15) + ' 224h27'" stroke="#eaf0ef" stroke-width="4" />
          <path [attr.d]="'M' + (bay.left + 13) + ' 351h31'" stroke="#617e91" stroke-width="3" />
          <text
            [attr.x]="bay.center"
            y="212"
            fill="#577182"
            font-size="11"
            font-weight="700"
            text-anchor="middle"
          >
            {{ bay.number }}
          </text>
        }
        <path d="M536 383h422" stroke="#f3d284" stroke-width="2" stroke-dasharray="10 5" />
        <path
          d="M716 398h40m-7-5 7 5-7 5m-40 23h-40m7-5-7 5 7 5"
          fill="none"
          stroke="#738d9d"
          stroke-width="3"
        />
      </g>
    }
    <g [attr.transform]="'translate(0 ' + capacity().garageExtension + ')'">
      <rect x="540" y="404" width="34" height="34" fill="url(#cr-hazard)" opacity=".7" />
      <rect x="925" y="408" width="29" height="29" fill="url(#cr-hazard)" opacity=".7" />
    </g>
    <rect
      x="592"
      [attr.y]="capacity().fronts.garage - 6"
      width="315"
      height="8"
      fill="url(#cr-hazard)"
    />
    @for (row of bedRows(); track row.y) {
      <rect
        x="49"
        [attr.y]="row.y - 7"
        width="403"
        height="64"
        rx="6"
        fill="#bfd3c6"
        stroke="#9fb9ae"
      />
    }
    @for (row of deskRows(); track row.y) {
      <rect
        x="1022"
        [attr.y]="row.y - 33"
        width="242"
        height="50"
        rx="6"
        fill="#c8d3b7"
        stroke="#aeba9f"
      />
    }
    @for (row of warehouseRows(); track row.y) {
      <path
        [attr.d]="'M583 ' + (row.y + 9) + 'h329'"
        stroke="#e6bb61"
        stroke-width="2"
        stroke-dasharray="8 5"
      />
    }
    <rect x="999" y="81" width="278" height="88" rx="10" fill="#73a5b4" opacity=".68" />
    <path
      d="M1007 160h260m-260 25h230"
      stroke="#f3f6ef"
      stroke-width="1.5"
      stroke-dasharray="3 4"
    />
    <path
      d="M1018 185v36h56v21m40-57v34h-27v23"
      fill="none"
      stroke="#5597a8"
      stroke-width="2"
      opacity=".64"
    />
    <rect x="1049" y="293" width="146" height="56" rx="7" fill="#c49883" opacity=".65" />
    <rect x="1003" y="389" width="136" height="51" rx="8" fill="#c8d3b7" stroke="#aeba9f" />
    <rect x="1222" y="331" width="56" height="109" rx="8" fill="#c8d3b7" stroke="#aeba9f" />
    <ellipse cx="137" cy="219" rx="124" ry="91" fill="url(#cr-lounge-light)" />
    <ellipse cx="1134" cy="306" rx="28" ry="38" fill="url(#cr-lounge-light)" />
  </g>
  <g class="furniture-shadows">
    @for (shadow of furnitureShadows(); track shadow) {
      <polygon [attr.points]="shadow" />
    }
  </g>
  <g class="solid construction">
    @for (wall of walls(); track $index) {
      @for (face of wall.faces; track $index) {
        <polygon [attr.points]="face.points" [attr.fill]="face.fill" />
      }
    }
  </g>
  @for (panel of panels; track panel.face) {
    <polygon
      class="wall-panel"
      [attr.points]="panel.face"
      [attr.fill]="panel.type === 'window' ? 'url(#cr-window-sheen)' : 'url(#cr-shutters)'"
    />
  }
  <g class="solid furniture">
    @for (item of furnishings(); track $index) {
      @for (face of item.faces; track $index) {
        <polygon [attr.points]="face.points" [attr.fill]="face.fill" />
      }
    }
  </g>
  <g class="solid construction">
    @for (edge of edges(); track $index) {
      @for (face of edge.faces; track $index) {
        <polygon [attr.points]="face.points" [attr.fill]="face.fill" />
      }
    }
  </g>
  @for (point of steam; track $index) {
    <g [attr.transform]="'translate(' + point.x + ' ' + point.y + ')'">
      <path class="steam" [class.moving]="animate()" d="M0 0q-4-4 0-8m4 7q4-4 0-9" />
    </g>
  }
  @for (sign of signs; track sign.label) {
    <g class="room-sign" [attr.transform]="'translate(' + sign.x + ' ' + sign.y + ')'">
      <rect [attr.width]="sign.width" x="0" y="-17" height="23" rx="6" [attr.fill]="sign.color" />
      <circle cx="12" cy="-5.5" r="2.4" fill="#f6ce81" />
      <text x="22" y="-1">{{ sign.label }}</text>
    </g>
  }
</svg>
<svg
  class="solid foreground-desks"
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  aria-hidden="true"
>
  @for (desk of foregroundDesks(); track $index) {
    @for (face of desk.faces; track $index) {
      <polygon [attr.points]="face.points" [attr.fill]="face.fill" />
    }
  }
</svg>
