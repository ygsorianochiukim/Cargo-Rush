<div class="cr-no-print mb-4 flex flex-wrap items-center gap-2">
  <button
    type="button"
    class="flex h-10 items-center gap-1.5 rounded-control px-3 text-[14px] font-semibold text-cr-ink-muted transition-colors hover:bg-cr-tint hover:text-cr-ink"
    (click)="back()"
  >
    <app-icon name="chevron-left" [size]="16" />
    Billing
  </button>

  <div class="ml-auto flex items-center gap-2">
    <button
      type="button"
      class="flex h-10 items-center gap-1.5 rounded-control bg-cr-success px-4 text-[14px] font-semibold text-cr-surface transition-colors hover:opacity-90"
      (click)="recordPayment()"
    >
      <app-icon name="wallet" [size]="16" />
      Record payment
    </button>

    <button
      type="button"
      class="flex h-10 items-center gap-1.5 rounded-control px-4 text-[14px] font-semibold text-cr-blue ring-1 ring-cr-line transition-colors hover:bg-cr-tint"
      (click)="edit()"
    >
      <app-icon name="tag" [size]="16" />
      Edit invoice
    </button>

    <button
      type="button"
      class="flex h-10 items-center gap-1.5 rounded-control px-4 text-[14px] font-semibold text-cr-blue ring-1 ring-cr-line transition-colors hover:bg-cr-tint"
      (click)="print()"
    >
      <app-icon name="clipboard" [size]="16" />
      Print
    </button>

    <button
      type="button"
      class="flex h-10 items-center gap-1.5 rounded-control bg-cr-blue px-4 text-[14px] font-semibold text-cr-surface transition-colors hover:bg-cr-blue-hover disabled:opacity-60"
      [disabled]="saving() || document() === null"
      (click)="savePdf()"
    >
      <app-icon name="billing" [size]="16" />
      {{ saving() ? 'Preparing PDF…' : 'Save as PDF' }}
    </button>
  </div>
</div>

@if (pdfError(); as message) {
  <p role="alert" class="cr-no-print mb-3 text-right text-[12px] font-medium text-cr-red">
    {{ message }}
  </p>
}

@if (error(); as message) {
  <app-error-state [message]="message" (retry)="load()" />
} @else if (document(); as doc) {
  <app-invoice-sheet [doc]="doc" />
} @else {
  <article
    class="mx-auto max-w-[820px] rounded-card bg-cr-surface p-8 shadow-card ring-1 ring-cr-line/60"
  >
    <div class="flex justify-between gap-6">
      <div class="flex gap-4">
        <div class="cr-skeleton h-14 w-14"></div>
        <div class="flex flex-col gap-2">
          <div class="cr-skeleton h-5 w-48"></div>
          <div class="cr-skeleton h-3 w-40"></div>
          <div class="cr-skeleton h-3 w-32"></div>
        </div>
      </div>
      <div class="flex flex-col items-end gap-2">
        <div class="cr-skeleton h-3 w-24"></div>
        <div class="cr-skeleton h-6 w-40"></div>
      </div>
    </div>
    <div class="mt-8 flex flex-col gap-2">
      <div class="cr-skeleton h-4 w-full"></div>
      <div class="cr-skeleton h-4 w-5/6"></div>
      <div class="cr-skeleton h-4 w-2/3"></div>
    </div>
  </article>
}
